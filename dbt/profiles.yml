classifieds:
  target: dev
  outputs:
    dev:
      type: clickhouse
      driver: http
      host: "{{ env_var('CH_HOST', 'localhost') }}"
      port: "{{ env_var('CH_PORT', '8123') | int }}"
      user: "{{ env_var('CH_USER', 'bi') }}"
      password: "{{ env_var('CH_PASSWORD', 'bi') }}"
      schema: marts
      threads: 2
      send_receive_timeout: 3600
